  <text x="72" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="-0.5">ESPERANÇA<tspan fill="#059669"> VIVA</tspan></text>
  <text x="72" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="1.5">RESGATE &amp; PROTEÇÃO ANIMAL</text>
</svg>

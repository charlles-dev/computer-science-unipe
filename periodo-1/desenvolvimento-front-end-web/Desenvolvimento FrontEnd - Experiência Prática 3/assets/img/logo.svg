  <circle cx="21" cy="27" r="4.2" fill="#ffffff"/>
  <circle cx="28" cy="21" r="4.2" fill="#ffffff"/>
  <circle cx="36" cy="21" r="4.2" fill="#ffffff"/>
  <circle cx="43" cy="27" r="4.2" fill="#ffffff"/>
